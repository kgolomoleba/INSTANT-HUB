<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="centerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon background (subtle) -->
  <polygon points="100,25 168,58 168,142 100,175 32,142 32,58" 
           fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>

  <!-- Connection lines -->
  <line x1="100" y1="50" x2="148" y2="75" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="50" x2="148" y2="125" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="50" x2="100" y2="150" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="50" x2="52" y2="125" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="50" x2="52" y2="75" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="148" y1="75" x2="148" y2="125" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="148" y1="125" x2="100" y2="150" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="150" x2="52" y2="125" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="52" y1="125" x2="52" y2="75" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="52" y1="75" x2="100" y2="50" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>

  <!-- Outer nodes -->
  <circle cx="100" cy="50" r="6" fill="url(#nodeGradient)" filter="url(#glow)"/>
  <circle cx="148" cy="75" r="6" fill="url(#nodeGradient)" filter="url(#glow)"/>
  <circle cx="148" cy="125" r="6" fill="url(#nodeGradient)" filter="url(#glow)"/>
  <circle cx="100" cy="150" r="6" fill="url(#nodeGradient)" filter="url(#glow)"/>
  <circle cx="52" cy="125" r="6" fill="url(#nodeGradient)" filter="url(#glow)"/>
  <circle cx="52" cy="75" r="6" fill="url(#nodeGradient)" filter="url(#glow)"/>

  <!-- Center node (larger, more vibrant) -->
  <circle cx="100" cy="100" r="10" fill="url(#centerGradient)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="6" fill="#fcd34d" opacity="0.6"/>
</svg>
